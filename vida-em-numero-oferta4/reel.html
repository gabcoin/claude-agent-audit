<script>
/* ==========================================================================
   VIDA EM NÚMERO — OFERTA 4 — 26s direct-response motion reel
   render(t) draws the frame at time t. 5-subframe motion blur + post stack.
   ========================================================================== */
const W = 1920, H = 1080, DUR = 26;
const C = {
  bg: '#0a0a0f', gold: '#d4be7e', goldHi: '#f6e7b8', goldDk: '#9d885c', ivory: '#eee7d7',
  violet: '#7c3aed', blue: '#93c5fd', lav: '#c4b5fd', red: '#ff6a55', rose: '#f2a3b8'
};
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const P = (t, a, b) => clamp((t - a) / (b - a));
const TAU = Math.PI * 2;
const E = {
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
  inOutExpo: x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2,
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outCubic: x => 1 - Math.pow(1 - x, 3), inCubic: x => x * x * x,
  outBack: x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }
};
function rng(seed) { let s = (seed * 2654435761) >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

/* ---------- timeline ---------- */
const IMPACTS = [[.15, .45], [.55, .9], [1.25, .9], [3, .5], [3.75, .35], [4.5, .35], [5.25, .35], [6, .55], [7.5, .7], [10.5, .8], [11.55, .5], [13.4, .6], [13.9, .5], [15.5, .7], [18, .55], [20, 1.25], [22, .55], [24, .8]];
const FLASHES = [[.55, .22], [1.25, .22], [7.5, .28], [10.5, .25], [15.5, .22], [20, .35], [24, .4]];
const GLITCH = [[5.55, 5.9, .9], [2.88, 3.02, .35], [13.4, 13.75, .45], [15.32, 15.5, .3]];
const SCENES = [
  { a: 0, b: 3, n: '01 — O GANCHO' }, { a: 3, b: 7.5, n: '02 — AS CENAS' }, { a: 7.5, b: 10.5, n: '03 — O ÍMÃ' },
  { a: 10.5, b: 15.5, n: '04 — A ÁRVORE DA BIA' }, { a: 15.5, b: 18, n: '05 — SEM CARTÓRIO' },
  { a: 18, b: 22, n: '06 — TUDO O QUE VOCÊ LEVA' }, { a: 22, b: 26, n: '07 — EM 1 MINUTO' }
];

/* ---------- numerology (site's letter table) ---------- */
const V = { A:1,B:2,C:3,D:4,E:5,F:8,G:3,H:5,I:1,J:1,K:2,L:3,M:4,N:5,O:7,P:8,Q:1,R:2,S:3,T:4,U:6,V:6,W:6,X:6,Y:1,Z:7 };
const red = n => { while (n > 9) n = [...String(n)].reduce((a, b) => a + +b, 0); return n; };
function buildTree(name) {
  const L = [...name.replace(/ /g, '')]; let r = L.map(c => V[c]); const rows = [r];
  while (r.length > 1) { r = r.slice(1).map((x, i) => red(x + r[i])); rows.push(r); }
  const neg = new Set(), runs = [];
  rows.forEach((row, ri) => { let j = 0; while (j < row.length) { let k = j; while (k < row.length && row[k] === row[j]) k++; if (k - j >= 3) { runs.push({ r: ri, j0: j, j1: k - 1 }); for (let m = j; m < k; m++) neg.add(ri + ',' + m); } j = k; } });
  return { L, rows, neg, runs };
}
const TB = buildTree('BIA SILVA'), TB2 = buildTree('BIA');

/* ---------- drawing helpers ---------- */
function font(ctx, fam, size, weight = 400, italic = false, sp = 0) { ctx.font = `${italic ? 'italic ' : ''}${weight} ${size}px ${fam}`; ctx.letterSpacing = sp + 'px'; }
function kt(ctx, str, x, y, o) {
  font(ctx, o.fam, o.size, o.weight || 400, o.italic, o.sp || 0);
  const total = ctx.measureText(str).width - (o.sp || 0);
  const x0 = o.align === 'left' ? x : o.align === 'right' ? x - total : x - total / 2;
  let A = o.alpha ?? 1; if (o.out) A *= 1 - P(o.t, o.out[0], o.out[1]);
  if (A <= .001) return total;
  const units = [];
  if (o.unit === 'word') { let i = 0; str.split(' ').forEach(w => { units.push([i, w]); i += w.length + 1; }); } else [...str].forEach((c, i) => units.push([i, c]));
  ctx.save(); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  if (o.mask !== false) { ctx.beginPath(); ctx.rect(x0 - o.size, y - o.size * 1.15, total + o.size * 2, o.size * 1.5); ctx.clip(); }
  ctx.fillStyle = o.color || C.ivory; if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.glowB || 24; }
  const ease = o.ease || E.outExpo, stag = o.stag ?? .03, dur = o.dur ?? .6;
  units.forEach(([i, u], k) => {
    const p = ease(P(o.t, o.t0 + k * stag, o.t0 + k * stag + dur)); if (p <= 0) return;
    ctx.globalAlpha = A * Math.min(1, p * 1.3);
    ctx.fillText(u, x0 + ctx.measureText(str.slice(0, i)).width, y + (1 - p) * o.size * (o.rise ?? 1));
  });
  ctx.restore(); return total;
}
function txt(ctx, str, x, y, fam, size, weight, color, align = 'center', alpha = 1, sp = 0, italic = false, base = 'alphabetic') {
  if (alpha <= .001) return;
  ctx.save(); font(ctx, fam, size, weight, italic, sp); ctx.fillStyle = color; ctx.globalAlpha *= alpha; ctx.textAlign = align; ctx.textBaseline = base;
  ctx.fillText(str, x + (sp && align === 'center' ? sp / 2 : sp && align === 'right' ? sp : 0), y); ctx.restore();
}
function glowDot(ctx, x, y, r, color, blur = 30, alpha = 1) { if (r <= 0 || alpha <= 0) return; ctx.save(); ctx.globalAlpha *= alpha; ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = blur; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); ctx.restore(); }
function neb(ctx, x, y, r, col) { const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); }
function arcP(ctx, x, y, r, p, a0 = -Math.PI / 2) { ctx.beginPath(); ctx.arc(x, y, r, a0, a0 + TAU * p); ctx.stroke(); }
function pill(ctx, cx, cy, w, h, r) { ctx.beginPath(); ctx.roundRect(cx - w / 2, cy - h / 2, w, h, r ?? h / 2); }
function dashDraw(ctx, len, p) { ctx.setLineDash([len, len]); ctx.lineDashOffset = len * (1 - p); }
function polyTri(ctx, x, y, r, rot) { ctx.beginPath(); for (let i = 0; i < 3; i++) { const a = rot + i * TAU / 3; ctx[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * r, y + Math.sin(a) * r); } ctx.closePath(); }
function goldGrad(ctx, y0, y1) { const g = ctx.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, C.goldHi); g.addColorStop(.55, C.gold); g.addColorStop(1, C.goldDk); return g; }
function roseGrad(ctx, y0, y1) { const g = ctx.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, '#ffd9e2'); g.addColorStop(.55, C.rose); g.addColorStop(1, '#b8607a'); return g; }
function heart(ctx, x, y, s) { ctx.beginPath(); ctx.moveTo(x, y + s * .38); ctx.bezierCurveTo(x - s * 1.05, y - s * .2, x - s * .5, y - s * 1.0, x, y - s * .42); ctx.bezierCurveTo(x + s * .5, y - s * 1.0, x + s * 1.05, y - s * .2, x, y + s * .38); ctx.closePath(); }
function star(ctx, x, y, r) { ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; ctx[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * rr, y + Math.sin(a) * rr); } ctx.closePath(); }
function coin(ctx, x, y, r, a = 1) { ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = goldGrad(ctx, y - r, y + r); ctx.shadowColor = C.gold; ctx.shadowBlur = 14; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); ctx.shadowBlur = 0; ctx.strokeStyle = 'rgba(10,10,15,.35)'; ctx.lineWidth = r * .1; ctx.beginPath(); ctx.arc(x, y, r * .74, 0, TAU); ctx.stroke(); txt(ctx, '$', x, y + 1, 'Inter', r * 1.05, 800, 'rgba(10,10,15,.75)', 'center', 1, 0, false, 'middle'); ctx.restore(); }
function heartIcon(ctx, x, y, s, a = 1) { ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = roseGrad(ctx, y - s, y + s * .4); ctx.shadowColor = C.rose; ctx.shadowBlur = 16; heart(ctx, x, y, s); ctx.fill(); ctx.restore(); }
// whip-pan helper: horizontal camera move in/out of a scene
function whip(ctx, s, len, inDur = .3, outDur = .25) {
  const dIn = inDur ? W * 1.15 * (1 - E.outExpo(P(s, 0, inDur))) : 0;
  ctx.translate(dIn - W * 1.15 * E.inExpo(P(s, len - outDur, len)), 0);
}
function shakeAmt(t) { let a = 0; for (const [ti, s] of IMPACTS) if (t >= ti) a += s * Math.exp(-(t - ti) * 9); return a; }

/* ---------- background ---------- */
const DUST = [...Array(170)].map((_, i) => { const r = rng(100 + i); return { x: r() * W, y: r() * H, z: r(), s: r() * 1.8 + .4, ph: r() * TAU }; });
function background(ctx, t, warm = 0) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  neb(ctx, W * (.28 + .08 * Math.sin(t * .4)), H * (.36 + .07 * Math.cos(t * .3)), 950, 'rgba(124,58,237,0.16)');
  neb(ctx, W * (.74 + .06 * Math.cos(t * .35)), H * (.68 + .05 * Math.sin(t * .5)), 850, 'rgba(212,190,126,0.085)');
  neb(ctx, W * .5, H * 1.1, 900, 'rgba(242,163,184,0.045)');
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.rotate(t * .025); ctx.strokeStyle = 'rgba(212,190,126,0.038)'; ctx.lineWidth = 1;
  const r = 130; for (let q = -5; q <= 5; q++) for (let s = -4; s <= 4; s++) { const x = r * (q + s * .5), y = r * s * Math.sqrt(3) / 2; if (x * x + y * y > 900 * 900) continue; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke(); }
  ctx.restore();
  for (const d of DUST) {
    const x = ((d.x + t * 24 * (d.z + .2)) % W + W) % W, y = ((d.y - t * 14 * (d.z + .1)) % H + H) % H;
    ctx.globalAlpha = (.12 + .4 * d.z) * (.55 + .45 * Math.sin(t * 2.2 + d.ph)); ctx.fillStyle = d.z > .7 ? C.goldHi : C.ivory;
    ctx.beginPath(); ctx.arc(x, y, d.s * (.6 + d.z), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ======================= S1 — HOOK (0–3) ======================= */
// a word whose letters drift apart: the name "pushing away" what matters
function spreadWord(ctx, str, cx, y, size, fill, k, sc, alpha) {
  ctx.save(); font(ctx, 'Cinzel', size, 900, false, 4); const total = ctx.measureText(str).width - 4;
  ctx.translate(cx, y); ctx.scale(sc, sc); ctx.globalAlpha *= alpha; ctx.fillStyle = fill; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  [...str].forEach((ch, i) => {
    const x0 = -total / 2 + ctx.measureText(str.slice(0, i)).width, w = ctx.measureText(ch).width, c = x0 + w / 2;
    const dx = c * k, dy = Math.sin(i * 1.7) * 30 * k;
    ctx.save(); ctx.translate(dx, dy); ctx.rotate(Math.sin(i * 2.3) * .25 * k); ctx.fillText(ch, x0, 0); ctx.restore();
  });
  ctx.restore();
}
const REPEL = [...Array(46)].map((_, i) => { const r = rng(300 + i); return { a: r() * TAU, v: 500 + r() * 700, d: r() * 1.3, k: i % 2, s: 14 + r() * 14, spin: (r() - .5) * 4 }; });
function scene1(ctx, t) {
  const s = t; ctx.save(); whip(ctx, s, 3, 0);
  // repelled coins & hearts flying outward from the centre
  REPEL.forEach(p => {
    const t0 = .6 + p.d, q = P(s, t0, t0 + 1.4); if (q <= 0 || q >= 1) return;
    const r = 80 + p.v * E.outCubic(q), x = W / 2 + Math.cos(p.a) * r * 1.4, y = 600 + Math.sin(p.a) * r * .8, a = Math.sin(q * Math.PI);
    ctx.save(); ctx.translate(x, y); ctx.rotate(p.spin * q);
    if (p.k) heartIcon(ctx, 0, 0, p.s, a * .85); else coin(ctx, 0, 0, p.s, a * .85); ctx.restore();
  });
  kt(ctx, 'SEU NOME ESTÁ AFASTANDO', W / 2, 300, { t: s, t0: .12, fam: 'Cinzel', size: 60, weight: 700, sp: 10, color: C.ivory, stag: .022, dur: .45 });
  const l1 = .55, l2 = 1.25;
  const p1 = E.outExpo(P(s, l1, l1 + .32)), p2 = E.outExpo(P(s, l2, l2 + .32));
  if (s > l1) { ctx.save(); ctx.shadowColor = C.gold; ctx.shadowBlur = 30; spreadWord(ctx, 'DINHEIRO', W / 2, 590, 190, goldGrad(ctx, 440, 600), .16 * E.outCubic(P(s, l1 + .3, 2.9)), lerp(2.3, 1, p1), P(s, l1, l1 + .06)); ctx.restore(); }
  if (s > l2) { ctx.save(); ctx.shadowColor = C.rose; ctx.shadowBlur = 30; spreadWord(ctx, 'E AMOR?', W / 2, 800, 190, roseGrad(ctx, 650, 810), .2 * E.outCubic(P(s, l2 + .3, 2.9)), lerp(2.3, 1, p2), P(s, l2, l2 + .06)); ctx.restore(); }
  kt(ctx, 'Veja agora, na tela, onde.', W / 2, 935, { t: s, t0: 2.05, fam: 'Cormorant', size: 46, weight: 600, italic: true, color: C.goldHi, unit: 'word', stag: .05, dur: .45 });
  ctx.restore();
}

/* ======================= S2 — PAIN SCENES (3–7.5) ======================= */
function painCard(ctx, s, i) {
  const enter = E.outExpo(P(s, 0, .3)), oy = (1 - enter) * 50;
  ctx.save(); ctx.translate(0, oy); ctx.globalAlpha = enter;
  const lines = ['Dia 20. E já não dá até o dia 30.', 'O elogio vai para outra pessoa.', 'A conversa morre na terceira semana.', 'Começa bem… e em algum ponto trava.'];
  if (i === 0) {
    const d = Math.round(lerp(20, 30, E.inOutCubic(P(s, .08, .6)))), money = 1 - E.inOutCubic(P(s, .08, .6));
    txt(ctx, String(d), W / 2, 520, 'Cinzel', 280, 900, d >= 28 ? C.red : C.ivory, 'center', 1);
    txt(ctx, 'DIA', W / 2, 260, 'Inter', 22, 600, C.gold, 'center', .8, 10);
    ctx.save(); ctx.fillStyle = 'rgba(255,255,255,.07)'; pill(ctx, W / 2, 600, 760, 22); ctx.fill();
    ctx.fillStyle = money > .3 ? C.gold : C.red; ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 18; ctx.beginPath(); ctx.roundRect(W / 2 - 380, 589, Math.max(22, 760 * money), 22, 11); ctx.fill(); ctx.restore();
    for (let k = 0; k < 6; k++) { const q = P(s, .1 + k * .07, .55 + k * .07); if (q > 0 && q < 1) coin(ctx, W / 2 - 380 + 760 * money + 10, 600 + 260 * E.inCubic(q), 16, 1 - q); }
  } else if (i === 1) {
    const xs = [W / 2 - 300, W / 2, W / 2 + 300], sx = lerp(xs[1], xs[2], E.inOutCubic(P(s, .2, .5)));
    ctx.save(); const g = ctx.createLinearGradient(0, 140, 0, 560); g.addColorStop(0, 'rgba(246,231,184,.0)'); g.addColorStop(1, 'rgba(246,231,184,.28)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(sx - 30, 140); ctx.lineTo(sx + 30, 140); ctx.lineTo(sx + 170, 560); ctx.lineTo(sx - 170, 560); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = .5; ctx.fillStyle = 'rgba(246,231,184,.35)'; ctx.beginPath(); ctx.ellipse(sx, 560, 170, 26, 0, 0, TAU); ctx.fill(); ctx.restore();
    xs.forEach((x, k) => { const lit = 1 - clamp(Math.abs(x - sx) / 220); ctx.save(); ctx.fillStyle = k === 1 ? C.gold : C.ivory; ctx.globalAlpha *= .25 + .75 * lit;
      ctx.beginPath(); ctx.arc(x, 380, 46, 0, TAU); ctx.fill(); ctx.beginPath(); ctx.ellipse(x, 530, 90, 70, 0, Math.PI, TAU); ctx.fill(); ctx.restore(); });
    txt(ctx, 'VOCÊ', xs[1], 610, 'Inter', 18, 600, C.gold, 'center', 1, 6);
  } else if (i === 2) {
    const p = P(s, .05, .55), x0 = W / 2 - 520, x1 = W / 2 + 520;
    ctx.save(); ctx.strokeStyle = C.rose; ctx.lineWidth = 4; ctx.shadowColor = C.rose; ctx.shadowBlur = 20; ctx.lineJoin = 'round'; ctx.beginPath();
    for (let x = x0; x <= lerp(x0, x1, p); x += 4) {
      const u = (x - x0) / (x1 - x0), amp = u < .62 ? 1 : 0, ph = (u * 3.2) % 1;
      const y = 440 - amp * (ph > .4 && ph < .46 ? -60 : ph > .46 && ph < .52 ? 170 : ph > .52 && ph < .58 ? -40 : 0);
      x === x0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke(); ctx.restore();
    ['SEMANA 1', 'SEMANA 2', 'SEMANA 3'].forEach((l, k) => txt(ctx, l, x0 + (k + .5) * 1040 / 3.2, 560, 'Inter', 16, 600, k === 2 ? C.rose : C.ivory, 'center', P(s, .1 + k * .12, .3 + k * .12) * .7, 4));
    heartIcon(ctx, lerp(x0, x1, Math.min(p, .62)), 300, 30, 1 - P(s, .45, .7));
  } else {
    const p = Math.min(.78, E.outCubic(P(s, .03, .4)) * .9), fr = s > .38;
    const jx = fr ? (Math.sin(s * 140) * 6) : 0;
    ctx.save(); ctx.translate(jx, 0); ctx.fillStyle = 'rgba(255,255,255,.07)'; pill(ctx, W / 2, 440, 900, 40); ctx.fill();
    ctx.fillStyle = fr ? C.red : C.gold; ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 22; ctx.beginPath(); ctx.roundRect(W / 2 - 450, 420, 900 * p, 40, 20); ctx.fill(); ctx.restore();
    txt(ctx, Math.round(p * 100) + '%', W / 2 + jx, 360, 'Cinzel', 96, 900, fr ? C.red : C.ivory, 'center', fr ? (Math.sin(s * 60) > -.3 ? 1 : .35) : 1);
  }
  ctx.restore();
  kt(ctx, lines[i], W / 2, 790, { t: s, t0: .06, fam: 'Cormorant', size: 64, weight: 600, italic: true, color: C.ivory, unit: 'word', stag: .035, dur: .4 });
}
function scene2(ctx, t) {
  const s = t - 3; ctx.save();
  ctx.translate(W * 1.15 * (1 - E.outExpo(P(s, 0, .3))), 0);
  if (s < 3) {
    const i = Math.min(3, Math.floor(s / .75)); painCard(ctx, s - i * .75, i);
    kt(ctx, 'VOCÊ CONHECE ESSAS CENAS', W / 2, 160, { t: s, t0: .05, fam: 'Inter', size: 20, weight: 600, sp: 10, color: C.gold, stag: .015, dur: .35 });
    txt(ctx, `0${i + 1} / 04`, W / 2, 205, 'Inter', 16, 600, C.ivory, 'center', .55, 4);
  } else {
    const u = s - 3;
    ctx.save(); ctx.globalAlpha = P(u, 0, .3); neb(ctx, W / 2, 540, 800, 'rgba(10,10,15,.8)'); ctx.restore();
    kt(ctx, 'Não é culpa sua.', W / 2, 520, { t: u, t0: .05, fam: 'Cinzel', size: 104, weight: 700, color: C.ivory, stag: .035, dur: .7, ease: E.outCubic, rise: .5 });
    kt(ctx, 'Você fez tudo certo.', W / 2, 620, { t: u, t0: .55, fam: 'Cormorant', size: 58, weight: 600, italic: true, color: C.gold, unit: 'word', stag: .07, dur: .6 });
  }
