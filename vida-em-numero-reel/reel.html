<script>
/* ==========================================================================
   VIDA EM NÚMERO — 20s motion reel
   Deterministic renderer: render(t) draws the frame at time t (seconds).
   Every frame = 5 sub-frame motion-blur accumulation + bloom + chroma + grain.
   ========================================================================== */
const W = 1920, H = 1080, DUR = 20;
const C = {
  bg: '#0a0a0f', gold: '#d4be7e', goldHi: '#f6e7b8', goldDk: '#9d885c',
  ivory: '#eee7d7', violet: '#7c3aed', violetL: '#8b5cf6', blue: '#93c5fd',
  lav: '#c4b5fd', red: '#ff6a55', mineral: '#8e9a96'
};

/* ---------- math ---------- */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));

const P = (t, a, b) => clamp((t - a) / (b - a));
const TAU = Math.PI * 2;
const E = {
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
  inOutExpo: x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2,
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inCubic: x => x * x * x,
  outBack: x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  outQuint: x => 1 - Math.pow(1 - x, 5)

function rng(seed) { let s = (seed * 2654435761) >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

/* ---------- timeline ---------- */
const IMPACTS = [[2.5, 1], [6, .8], [9, 1], [12.5, .7], [13.5, .35], [14.5, .35], [15.0, .5], [17.0, 1.25], [18, .7]];
const FLASHES = [[2.5, .3], [6, .3], [9, .32], [12.5, .3], [17.0, .35], [18, .45]];
const GLITCH = [[5.62, 6.02, 1], [2.44, 2.52, .35], [8.96, 9.04, .3]];
const SCENES = [
  { a: 0, b: 2.5, n: '01 — SEU NOME' },
  { a: 2.5, b: 6, n: '02 — A ÁRVORE' },
  { a: 6, b: 9, n: '03 — UMA LETRA' },
  { a: 9, b: 12.5, n: '04 — NÚCLEO HERMÉTICO' },
  { a: 12.5, b: 15.5, n: '05 — O MAPA POR DENTRO' },
  { a: 15.5, b: 18, n: '06 — A OFERTA' },
  { a: 18, b: 20, n: '07 — VIDA EM NÚMERO' }
];

/* ---------- numerology (Vida em Número's own letter table, verified vs. the site) ---------- */
const V = { A:1,B:2,C:3,D:4,E:5,F:8,G:3,H:5,I:1,J:1,K:2,L:3,M:4,N:5,O:7,P:8,Q:1,R:2,S:3,T:4,U:6,V:6,W:6,X:6,Y:1,Z:7 };
const red = n => { while (n > 9) n = [...String(n)].reduce((a, b) => a + +b, 0); return n; };
function buildTree(name) {
  const L = [...name.replace(/ /g, '')];
  let r = L.map(c => V[c]); const rows = [r];
  while (r.length > 1) { r = r.slice(1).map((x, i) => red(x + r[i])); rows.push(r); }
  const neg = new Set(), runs = [];
  rows.forEach((row, ri) => { let j = 0; while (j < row.length) { let k = j; while (k < row.length && row[k] === row[j]) k++; if (k - j >= 3) { runs.push({ r: ri, j0: j, j1: k - 1 }); for (let m = j; m < k; m++) neg.add(ri + ',' + m); } j = k; } });
  const words = []; let idx = 0; name.split(' ').forEach(w => { words.push([idx, idx + w.length - 1]); idx += w.length; });
  return { L, rows, neg, runs, words };
}
const TR1 = buildTree('CAROLINE PAOLA OLIVEIRA DA SILVA');
const TR2 = buildTree('PAOLLA OLIVEIRA');
const MORPH = [8, 9, 10, 11, -1, 12, 13, 14, 15, 16, 17, 18, 19, 20];

/* ---------- drawing helpers ---------- */
function font(ctx, fam, size, weight = 400, italic = false, sp = 0) {
  ctx.font = `${italic ? 'italic ' : ''}${weight} ${size}px ${fam}`;
  ctx.letterSpacing = sp + 'px';
}
// Kinetic text: masked per-char (or per-word) rise, kerning preserved via prefix measurement.
function kt(ctx, str, x, y, o) {
  font(ctx, o.fam, o.size, o.weight || 400, o.italic, o.sp || 0);
  const total = ctx.measureText(str).width - (o.sp || 0);
  const x0 = o.align === 'left' ? x : o.align === 'right' ? x - total : x - total / 2;
  let A = o.alpha ?? 1; if (o.out) A *= 1 - P(o.t, o.out[0], o.out[1]);
  if (A <= 0.001) return total;
  const units = [];
  if (o.unit === 'word') { let i = 0; str.split(' ').forEach(w => { units.push([i, w]); i += w.length + 1; }); }
  else [...str].forEach((c, i) => units.push([i, c]));
  ctx.save(); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  if (o.mask !== false) { ctx.beginPath(); ctx.rect(x0 - o.size, y - o.size * 1.15, total + o.size * 2, o.size * 1.5); ctx.clip(); }
  ctx.fillStyle = o.color || C.ivory;
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.glowB || 24; }
  const ease = o.ease || E.outExpo, stag = o.stag ?? .03, dur = o.dur ?? .6;
  units.forEach(([i, u], k) => {
    const p = ease(P(o.t, o.t0 + k * stag, o.t0 + k * stag + dur)); if (p <= 0) return;
    const px = x0 + ctx.measureText(str.slice(0, i)).width;
    ctx.globalAlpha = A * Math.min(1, p * 1.3);

}

  ctx.save(); font(ctx, fam, size, weight, italic, sp); ctx.fillStyle = color; ctx.globalAlpha *= alpha;
  ctx.textAlign = align; ctx.textBaseline = base;

  ctx.fillText(str, x + dx, y); ctx.restore();
}
function glowDot(ctx, x, y, r, color, blur = 30, alpha = 1) {
  if (r <= 0 || alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = blur;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); ctx.restore();
}
function neb(ctx, x, y, r, col) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}
function arcP(ctx, x, y, r, p, a0 = -Math.PI / 2) { ctx.beginPath(); ctx.arc(x, y, r, a0, a0 + TAU * p); ctx.stroke(); }
function pill(ctx, cx, cy, w, h) { ctx.beginPath(); ctx.roundRect(cx - w / 2, cy - h / 2, w, h, h / 2); }
function dashDraw(ctx, len, p) { ctx.setLineDash([len, len]); ctx.lineDashOffset = len * (1 - p); }

/* ---------- camera shake from impacts ---------- */
function shakeAmt(t) { let a = 0; for (const [ti, s] of IMPACTS) if (t >= ti) a += s * Math.exp(-(t - ti) * 9); return a; }

/* ---------- background ---------- */
const DUST = [...Array(170)].map((_, i) => { const r = rng(100 + i); return { x: r() * W, y: r() * H, z: r(), s: r() * 1.8 + .4, ph: r() * TAU }; });
function background(ctx, t) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  neb(ctx, W * (.28 + .08 * Math.sin(t * .4)), H * (.36 + .07 * Math.cos(t * .3)), 950, 'rgba(124,58,237,0.17)');
  neb(ctx, W * (.74 + .06 * Math.cos(t * .35)), H * (.68 + .05 * Math.sin(t * .5)), 850, 'rgba(212,190,126,0.085)');
  neb(ctx, W * .5, H * 1.1, 900, 'rgba(147,197,253,0.05)');
  // flower-of-life lattice, slowly turning
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.rotate(t * .025); ctx.strokeStyle = 'rgba(212,190,126,0.04)'; ctx.lineWidth = 1;
  const r = 130;
  for (let q = -5; q <= 5; q++) for (let s = -4; s <= 4; s++) {
    const x = r * (q + s * .5), y = r * s * Math.sqrt(3) / 2; if (x * x + y * y > 900 * 900) continue;
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
  }
  ctx.restore();
  for (const d of DUST) {
    const x = ((d.x + t * 24 * (d.z + .2)) % W + W) % W, y = ((d.y - t * 14 * (d.z + .1)) % H + H) % H;
    ctx.globalAlpha = (.12 + .4 * d.z) * (.55 + .45 * Math.sin(t * 2.2 + d.ph));
    ctx.fillStyle = d.z > .7 ? C.goldHi : C.ivory; ctx.beginPath(); ctx.arc(x, y, d.s * (.6 + d.z), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ======================= SCENE 1 — IGNITION / DIAL ======================= */
const S1P = [...Array(150)].map((_, i) => { const r = rng(11 + i * 7); return { x: (r() - .5) * W * .7, a: r() * TAU, v: 160 + r() * 560, d: i % 10, sz: 14 + r() * 16, spin: (r() - .5) * 8 }; });
function scene1(ctx, t) {
  const s = t, cx = W / 2, cy = H / 2;
  const zIn = E.inExpo(P(s, 2.02, 2.5));
  ctx.save(); ctx.translate(cx, cy); ctx.scale(1 + zIn * 7, 1 + zIn * 7); ctx.rotate(zIn * .55 + s * .03); ctx.translate(-cx, -cy);
  ctx.globalAlpha = 1 - P(s, 2.3, 2.5) * .7;
  // hairline
  const lw = E.outExpo(P(s, .12, .8)), lineA = 1 - P(s, .95, 1.4);
  if (lineA > 0 && lw > 0) {
    ctx.save(); ctx.globalAlpha *= lineA; ctx.strokeStyle = C.goldHi; ctx.lineWidth = 2; ctx.shadowColor = C.gold; ctx.shadowBlur = 28;
    ctx.beginPath(); ctx.moveTo(cx - W * .36 * lw, cy); ctx.lineTo(cx + W * .36 * lw, cy); ctx.stroke(); ctx.restore();
  }
  const pt = E.outBack(P(s, 0, .25)) * (1 - P(s, .55, .9));
  glowDot(ctx, cx, cy, 7 * pt, C.goldHi, 50);
  // digit particles: burst from the line, then vortex into a numerological dial
  const burst = E.outExpo(P(s, .5, 1.25)), conv = E.inOutCubic(P(s, 1.02, 1.85)), rot = s * .16;
  if (s > .5) S1P.forEach((p, i) => {
    const sx = cx + p.x, bx = sx + Math.cos(p.a) * p.v * burst, by = cy + Math.sin(p.a) * p.v * burst * .7;
    let ta, tr; if (i < 10) { ta = -Math.PI / 2 + i / 10 * TAU + rot; tr = 300; } else { ta = (i - 10) / (S1P.length - 10) * TAU + rot; tr = 378; }
    const sw = (1 - conv) * 2.2, tx = cx + Math.cos(ta + sw) * tr, ty = cy + Math.sin(ta + sw) * tr;
    const x = lerp(bx, tx, conv), y = lerp(by, ty, conv), a = P(s, .5, .62);
    ctx.save(); ctx.globalAlpha *= a;
    if (i < 10) {
      ctx.translate(x, y); ctx.rotate((1 - conv) * p.spin);
      txt(ctx, String(p.d), 0, 0, 'Cinzel', lerp(p.sz, 44, conv), 700, conv > .5 ? C.goldHi : C.ivory, 'center', 1, 0, false, 'middle');
    } else {
      if (conv < 1) { ctx.save(); ctx.translate(x, y); ctx.rotate((1 - conv) * p.spin); txt(ctx, String(p.d), 0, 0, 'Inter', p.sz, 300, C.ivory, 'center', (1 - conv) * .75, 0, false, 'middle'); ctx.restore(); }
      glowDot(ctx, x, y, 2.4 * conv, C.gold, 8, conv);
    }
    ctx.restore();
  });
  // dial strokes

  ctx.save(); ctx.strokeStyle = C.gold; ctx.lineWidth = 1.5; ctx.shadowColor = C.gold; ctx.shadowBlur = 10;
  ctx.globalAlpha *= .8; arcP(ctx, cx, cy, 250, d1, -Math.PI / 2 + rot); arcP(ctx, cx, cy, 345, d2, Math.PI / 2 + rot);
  ctx.globalAlpha *= .6;
  for (let i = 0; i < 120; i++) {
    const tp = P(s, 1.2 + i * .004, 1.35 + i * .004); if (tp <= 0) continue;
    const a = i / 120 * TAU + rot, major = i % 12 === 0, r0 = 345, r1 = 345 + (major ? 16 : 7) * tp;
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0); ctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1); ctx.stroke();
  }
  ctx.restore();
  // title inside the dial
  kt(ctx, 'SEU NOME', cx, cy - 4, { t: s, t0: 1.28, fam: 'Cinzel', size: 66, weight: 700, sp: 10, color: C.ivory, stag: .04, dur: .55 });
  kt(ctx, 'é um número.', cx, cy + 66, { t: s, t0: 1.5, fam: 'Cormorant', size: 62, weight: 600, italic: true, color: C.gold, stag: .028, dur: .6, glow: 'rgba(212,190,126,.5)', glowB: 18 });
  ctx.restore();
}

/* ======================= SCENE 2 — THE TREE (birth name) ======================= */
const S2 = { cell: 60, x0: (W - 28 * 60) / 2 + 30, ly: 205, ty: 272, rh: 26 };
function scene2(ctx, t) {
  const s = t - 2.5, { cell, x0, ly, ty, rh } = S2, T = TR1;
  const z = (1 + .55 * (1 - E.outExpo(P(s, 0, .7)))) * (1 + .035 * E.inOutCubic(P(s, 0, 3.5)));
  ctx.save(); ctx.translate(W / 2, 560); ctx.scale(z, z); ctx.rotate(-.12 * (1 - E.outExpo(P(s, 0, .7)))); ctx.translate(-W / 2, -560);
  // header
  kt(ctx, 'NOME DE NASCIMENTO', 120, 140, { t: s, t0: .1, fam: 'Inter', size: 18, weight: 600, sp: 6, color: C.gold, align: 'left', stag: .015, dur: .4 });
  ctx.save(); ctx.strokeStyle = C.gold; ctx.globalAlpha = .45; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(120, 156); ctx.lineTo(120 + 430 * E.outExpo(P(s, .2, .9)), 130); ctx.stroke(); ctx.restore();
  // scan
  const scanP = E.inOutCubic(P(s, 2.5, 3.0)), scanY = lerp(ty - 30, ty + 27 * rh + 34, scanP), scanOn = s > 2.45 && s < 3.12;
  const dimOf = y => s < 2.5 ? 0 : clamp((scanY - y) / 40);
  // letters
  let visible = 0;
  T.L.forEach((ch, i) => {
    const a = E.outBack(P(s, .05 + i * .02, .42 + i * .02)), fl = .6 + i * .028, dimL = P(s, fl, fl + .15);
    if (a <= 0) return;
    txt(ctx, ch, x0 + i * cell, ly - (1 - a) * 46, 'Cinzel', 44, 700, C.ivory, 'center', clamp(a) * (1 - .45 * dimL) * (1 - .5 * dimOf(ly)));
  });
  T.words.forEach(([w0, w1], k) => {
    const p = E.outExpo(P(s, .45 + k * .05, .9 + k * .05)); if (p <= 0) return;
    ctx.save(); ctx.strokeStyle = C.gold; ctx.globalAlpha = .75 * (1 - .6 * dimOf(ly)); ctx.lineWidth = 2;
    const xa = x0 + w0 * cell - cell / 2 + 8, xb = x0 + w1 * cell + cell / 2 - 8;
    ctx.beginPath(); ctx.moveTo(xa, ly + 18); ctx.lineTo(lerp(xa, xb, p), ly + 18); ctx.stroke(); ctx.restore();
  });
  // tree
  T.rows.forEach((row, r) => {
    const y = ty + r * rh, d = dimOf(y);
    row.forEach((v, j) => {
      const x = x0 + (j + r / 2) * cell;
      const tj = r === 0 ? .6 + j * .028 : 1.5 + r * .038 + j * .003;
      const p = P(s, tj, tj + .2); if (p <= 0) return; visible++;
      const neg = T.neg.has(r + ',' + j);
      if (r === 0) { // connector flash from letter
        const fa = 1 - P(s, tj, tj + .3);
        if (fa > 0) { ctx.save(); ctx.strokeStyle = C.goldHi; ctx.globalAlpha = fa * .8; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x, ly + 22); ctx.lineTo(x, y - 18); ctx.stroke(); ctx.restore(); }
      } else {
        const sa = 1 - P(s, tj, tj + .4);
        if (sa > 0) { ctx.save(); ctx.strokeStyle = C.gold; ctx.globalAlpha = sa * .5; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x - cell / 2, y - rh + 4); ctx.lineTo(x, y - 14); ctx.lineTo(x + cell / 2, y - rh + 4); ctx.stroke(); ctx.restore(); }
      }
      const sc = lerp(r === 0 ? 1.9 : 1.5, 1, E.outExpo(p));
      const hit = neg ? E.outBack(clamp((scanY - y) / 30)) * (s > 2.5 ? 1 : 0) : 0;
      ctx.save(); ctx.translate(x, y - 7); ctx.scale(sc * (1 + .35 * hit * (1 - P(s, 3.0, 3.2) * .6)), sc * (1 + .35 * hit * (1 - P(s, 3.0, 3.2) * .6)));
      const col = neg && hit > 0 ? C.red : (r === 0 ? C.gold : C.ivory);
      if (neg && hit > 0) { ctx.shadowColor = C.red; ctx.shadowBlur = 18; }
      txt(ctx, String(v), 0, 0, 'Inter', r === 0 ? 22 : 19, 600, col, 'center', Math.min(1, p * 1.5) * (neg ? 1 : (r === 0 ? 1 : .82) * (1 - .72 * d)), 0, false, 'middle');
      ctx.restore();
    });
  });

  T.runs.forEach(run => {
    const y = ty + run.r * rh, k = E.outBack(clamp((scanY - y) / 34)); if (s < 2.5 || k <= 0) return;
    const xa = x0 + (run.j0 + run.r / 2) * cell - cell * .42, xb = x0 + (run.j1 + run.r / 2) * cell + cell * .42;
    ctx.save(); ctx.translate((xa + xb) / 2, y - 7); ctx.scale(k, k); ctx.strokeStyle = C.red; ctx.lineWidth = 2; ctx.shadowColor = C.red; ctx.shadowBlur = 16;
    ctx.fillStyle = 'rgba(255,106,85,.12)'; pill(ctx, 0, 0, xb - xa, 26); ctx.fill(); ctx.stroke(); ctx.restore();
  });

    g.addColorStop(0, 'rgba(212,190,126,0)'); g.addColorStop(1, 'rgba(212,190,126,.18)'); ctx.fillStyle = g; ctx.fillRect(x0 - 60, scanY - 60, 28 * cell + 60, 60);
    ctx.strokeStyle = C.goldHi; ctx.lineWidth = 2; ctx.shadowColor = C.gold; ctx.shadowBlur = 24; ctx.beginPath(); ctx.moveTo(x0 - 60, scanY); ctx.lineTo(x0 + 28 * cell, scanY); ctx.stroke(); ctx.restore();
  }

  const wp = E.outBack(P(s, 2.85, 3.15));

const SPARKS = [...Array(110)].map((_, i) => { const r = rng(900 + i); return { a: r() * TAU, v: 300 + r() * 900, l: 10 + r() * 40, w: 1 + r() * 2.5 }; });
function scene6(ctx, t) {
  const s = t - 15.5, cx = W / 2, punch = 1 + .07 * Math.exp(-Math.max(0, s - 1.5) * 7) * (s > 1.5 ? 1 : 0);
  const out = E.inCubic(P(t, 17.82, 18.12));
  ctx.save(); ctx.translate(cx, 560); ctx.scale(punch * (1 + out * .25), punch * (1 + out * .25)); ctx.translate(-cx, -560); ctx.globalAlpha = 1 - out;
  // god rays
  const ra = .055 * P(s, .6, 1.2) + .05 * Math.exp(-Math.max(0, s - 1.5) * 3) * (s > 1.5 ? 1 : 0);
  if (ra > 0) { ctx.save(); ctx.translate(cx, 560); ctx.rotate(s * .12); ctx.fillStyle = C.gold; ctx.globalAlpha *= ra;
    for (let i = 0; i < 28; i++) { const a = i / 28 * TAU; ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 1500, a, a + TAU / 56); ctx.closePath(); ctx.fill(); } ctx.restore(); }

  // old price + strike

    ctx.moveTo(cx - ow / 2 - 20, 360); ctx.lineTo(lerp(cx - ow / 2 - 20, cx + ow / 2 + 20, sp), lerp(360, 344, sp)); ctx.stroke(); ctx.restore(); }

    const [d, L] = rd, p = P(s, .72, L), pos = (1 - E.outCubic(p)) * (18 + i * 2);
    if (s >= L) { ctx.fillText(String(d), x, base); ctx.restore(); const fp = P(s, L, L + .3); glowDot(ctx, x + size * .3, base + 14, 30 * (1 - fp), C.goldHi, 40, 1 - fp); return; }
    ctx.shadowBlur = 0; ctx.globalAlpha *= P(s, .72, .8); ctx.beginPath(); ctx.rect(x - 20, base - size * .9, size, size * 1.08); ctx.clip();

      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - Math.cos(k.a) * k.l * (1 - sp2 * .7), y - Math.sin(k.a) * k.l * (1 - sp2 * .7)); ctx.stroke(); });
    ctx.restore();
  }
  // badges
  const badges = [['ECONOMIA DE R$ 99,10', true], ['PAGAMENTO ÚNICO  ·  PIX OU CARTÃO', false], ['7 DIAS DE GARANTIA', false]];
  font(ctx, 'Inter', 18, 600, false, 3);
  const bw = badges.map(([l]) => ctx.measureText(l).width + 56), gap = 22, tw = bw.reduce((a, b) => a + b, 0) + gap * 2;
  let bx = cx - tw / 2;
  badges.forEach(([l, fill], k) => {
    const p = E.outBack(P(s, 1.62 + k * .09, 1.92 + k * .09)), x = bx + bw[k] / 2; bx += bw[k] + gap; if (p <= 0) return;
    ctx.save(); ctx.translate(x, 790); ctx.scale(p, p); ctx.fillStyle = fill ? C.gold : 'rgba(10,10,15,.8)'; ctx.strokeStyle = fill ? C.goldHi : 'rgba(212,190,126,.6)'; ctx.lineWidth = 1.5;
    if (fill) { ctx.shadowColor = C.gold; ctx.shadowBlur = 26; }
    pill(ctx, 0, 0, bw[k], 54); ctx.fill(); ctx.stroke(); ctx.shadowBlur = 0;
    txt(ctx, l, 0, 1, 'Inter', 18, fill ? 800 : 600, fill ? C.bg : C.ivory, 'center', 1, 3, false, 'middle'); ctx.restore();
  });
  ctx.restore();
}

/* ======================= SCENE 7 — END CARD ======================= */
function brandMark(ctx, x, y, s, scale = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
  ctx.strokeStyle = C.gold; ctx.lineWidth = 2.2; ctx.shadowColor = C.gold; ctx.shadowBlur = 20; ctx.lineCap = 'round';
  arcP(ctx, 0, 0, 95, E.inOutCubic(P(s, 0, .55)), -Math.PI / 2);
  const tp = E.outExpo(P(s, .15, .65));
  ctx.globalAlpha *= tp; polyTri(ctx, 0, 0, 70 * tp, -Math.PI / 2 + (1 - tp) * 1.5); ctx.stroke(); polyTri(ctx, 0, 0, 70 * tp, Math.PI / 2 - (1 - tp) * 1.5); ctx.stroke();
  ctx.globalAlpha = 1; ctx.restore();
  glowDot(ctx, x, y, 7 * E.outBack(P(s, .4, .7)), C.goldHi, 30);
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i / 10 * TAU + s * .12;
    txt(ctx, String(i), x + Math.cos(a) * 128 * scale, y + Math.sin(a) * 128 * scale, 'Cinzel', 20 * scale, 700, C.gold, 'center', P(s, .3 + i * .03, .6 + i * .03) * .75, 0, false, 'middle');
  }
}
function scene7(ctx, t) {
  const s = t - 18, a = P(t, 17.92, 18.1);
  ctx.save(); ctx.globalAlpha = a;
  neb(ctx, W / 2, 300, 520, 'rgba(212,190,126,.10)');
  brandMark(ctx, W / 2, 290, s);
  font(ctx, 'Cinzel', 92, 700);
  const sp = lerp(70, 22, E.outExpo(P(s, 0, 1.0)));
  txt(ctx, 'VIDA EM NÚMERO', W / 2, 545, 'Cinzel', 92, 700, C.ivory, 'center', P(s, .02, .3), sp);
  kt(ctx, 'Descubra se o seu nome trabalha a favor do seu caminho.', W / 2, 620, { t: s, t0: .45, fam: 'Cormorant', size: 42, weight: 500, italic: true, color: C.gold, unit: 'word', stag: .03, dur: .55 });
  const cp = E.outBack(P(s, .75, 1.1));
  if (cp > 0) {
    const pw = 640, ph = 86, cy = 735, pulse = s > 1.3 ? .5 + .5 * Math.sin((s - 1.3) * 8) : 0;
    ctx.save(); ctx.translate(W / 2, cy); ctx.scale(cp, cp);
    ctx.shadowColor = C.gold; ctx.shadowBlur = 30 + 20 * pulse; ctx.fillStyle = goldGrad(ctx, -ph / 2, ph / 2); pill(ctx, 0, 0, pw, ph); ctx.fill(); ctx.shadowBlur = 0;
    const sh = P(s, 1.2, 1.75);
    if (sh > 0 && sh < 1) { ctx.save(); pill(ctx, 0, 0, pw, ph); ctx.clip(); const sx = lerp(-pw, pw, E.inOutCubic(sh));
      const g = ctx.createLinearGradient(sx - 90, 0, sx + 90, 0); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.5, 'rgba(255,255,255,.75)'); g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g; ctx.transform(1, 0, -.4, 1, 0, 0); ctx.fillRect(sx - 90, -ph, 180, ph * 2); ctx.restore(); }
    txt(ctx, 'QUERO MEU MAPA COMPLETO  →', 0, 2, 'Inter', 24, 800, C.bg, 'center', 1, 3, false, 'middle');
    ctx.restore();
  }
  txt(ctx, 'R$ 49,90  ·  pagamento único  ·  7 dias de garantia', W / 2, 838, 'Inter', 20, 400, C.ivory, 'center', P(s, 1.0, 1.3) * .6, 1);
  kt(ctx, 'vidaemnumero.com', W / 2, 905, { t: s, t0: 1.05, fam: 'Cinzel', size: 30, weight: 700, sp: 6, color: C.gold, stag: .02, dur: .4 });
  ctx.restore();
}

/* ======================= HUD ======================= */
function hud(ctx, t) {
  const a = .5 * P(t, .3, .9) * (1 - .45 * P(t, 18, 18.6)); if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = C.ivory; ctx.lineWidth = 1.5;
  const m = 46, L = 30;
  [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]].forEach(([x, y, sx, sy]) => { ctx.beginPath(); ctx.moveTo(x + sx * L, y); ctx.lineTo(x, y); ctx.lineTo(x, y + sy * L); ctx.stroke(); });
  ctx.restore();
  txt(ctx, 'VIDA EM NÚMERO  /  OFERTA 3', 70, 78, 'Inter', 13, 600, C.ivory, 'left', a, 4);
  const f = Math.floor(t * 30 + 1e-6), tc = `TC 00:00:${String(Math.floor(f / 30)).padStart(2, '0')}:${String(f % 30).padStart(2, '0')}`;
  ctx.save(); ctx.globalAlpha = a; font(ctx, 'Inter', 13, 600); ctx.fillStyle = C.ivory; ctx.textAlign = 'center';
  [...tc].forEach((ch, i) => ctx.fillText(ch, W - 70 - (tc.length - i - .5) * 10.5, 78)); ctx.restore();
  const sc = SCENES.find(x => t >= x.a && t < x.b) || SCENES[6];
  txt(ctx, sc.n, 70, H - 64, 'Inter', 13, 600, C.gold, 'left', a * 1.4, 4);
  txt(ctx, 'MOTION REEL  ·  2026', W - 70, H - 64, 'Inter', 13, 600, C.ivory, 'right', a, 4);
  ctx.save(); ctx.globalAlpha = a * .7; ctx.fillStyle = 'rgba(238,231,215,.25)'; ctx.fillRect(470, H - 69, W - 940, 1);
  ctx.fillStyle = C.gold; ctx.fillRect(470, H - 70, (W - 940) * t / DUR, 2); ctx.restore();
}

/* ======================= COMPOSITOR ======================= */
function drawScene(ctx, t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; ctx.setLineDash([]);
  background(ctx, t);
  const sh = shakeAmt(t), sx = sh * 16 * (Math.sin(t * 91.3) + Math.sin(t * 57.7 + 1.3)) / 2, sy = sh * 16 * (Math.sin(t * 73.1 + 2) + Math.sin(t * 41.9)) / 2;
  ctx.save(); ctx.translate(sx, sy);
  if (t < 2.5) scene1(ctx, t);
  else if (t < 6) scene2(ctx, t);
  else if (t < 9) scene3(ctx, t);
  else if (t < 12.5) scene4(ctx, t);
  else if (t < 15.5) scene5(ctx, t);
  if (t >= 15.5 && t < 18.12) scene6(ctx, t);
  if (t >= 17.92) scene7(ctx, t);
  ctx.restore();

const mk = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const out = document.getElementById('c'), octx = out.getContext('2d');
const acc = mk(), actx = acc.getContext('2d'), tmp = mk(), tctx = tmp.getContext('2d');
const small = mk(480, 270), sctx = small.getContext('2d');
const rC = mk(), rctx = rC.getContext('2d'), cC = mk(), cctx = cC.getContext('2d');
const grains = [0, 1, 2, 3].map(k => { const c = mk(256, 256), g = c.getContext('2d'), id = g.createImageData(256, 256), r = rng(77 + k);
  for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; } g.putImageData(id, 0, 0); return octx.createPattern(c, 'repeat'); });

function render(t, N = 5) {
  const shutter = .5 / 30;
  for (let k = 0; k < N; k++) {
    const ts = clamp(t + (N > 1 ? ((k + .5) / N - .5) * shutter : 0), 0, DUR - 1e-4);
    drawScene(tctx, ts); actx.globalAlpha = 1 / (k + 1); actx.drawImage(tmp, 0, 0);
  }
  actx.globalAlpha = 1;
  // chromatic aberration
  let ca = shakeAmt(t) * 7, gl = 0;
  for (const [a, b, s] of GLITCH) if (t >= a && t < b) gl = Math.max(gl, s * Math.sin(P(t, a, b) * Math.PI));
  ca += gl * 14;
  octx.setTransform(1, 0, 0, 1, 0, 0); octx.globalCompositeOperation = 'source-over'; octx.globalAlpha = 1; octx.filter = 'none';
  if (ca > .6) {
    rctx.globalCompositeOperation = 'source-over'; rctx.drawImage(acc, 0, 0); rctx.globalCompositeOperation = 'multiply'; rctx.fillStyle = '#f00'; rctx.fillRect(0, 0, W, H);
    cctx.globalCompositeOperation = 'source-over'; cctx.drawImage(acc, 0, 0); cctx.globalCompositeOperation = 'multiply'; cctx.fillStyle = '#0ff'; cctx.fillRect(0, 0, W, H);
    octx.fillStyle = '#000'; octx.fillRect(0, 0, W, H); octx.globalCompositeOperation = 'lighter';
    octx.drawImage(rC, ca, 0); octx.drawImage(cC, -ca, 0); octx.globalCompositeOperation = 'source-over';
  } else octx.drawImage(acc, 0, 0);
  // glitch slices
  if (gl > 0) {
    const r = rng(Math.floor(t * 30) + 5); actx.drawImage(out, 0, 0);
    for (let i = 0; i < 10; i++) { const y = r() * H, h = 6 + r() * 70 * gl, dx = (r() - .5) * 220 * gl; octx.drawImage(acc, 0, y, W, h, dx, y, W, h); }
    if (r() < .5 * gl) { octx.globalCompositeOperation = 'lighter'; octx.fillStyle = 'rgba(124,58,237,.18)'; octx.fillRect(0, r() * H, W, 4 + r() * 20); octx.globalCompositeOperation = 'source-over'; }
  }

  sctx.filter = 'contrast(2.4) brightness(.62)'; sctx.drawImage(out, 0, 0, 480, 270); sctx.filter = 'none';
  octx.globalCompositeOperation = 'screen'; octx.filter = 'blur(9px)'; octx.globalAlpha = .55; octx.drawImage(small, 0, 0, W, H);
  octx.globalCompositeOperation = 'lighter'; octx.filter = 'blur(34px)'; octx.globalAlpha = .22; octx.drawImage(small, 0, 0, W, H);
  octx.filter = 'none'; octx.globalAlpha = 1; octx.globalCompositeOperation = 'source-over';
  // flash
  let fl = 0; for (const [ti, s] of FLASHES) if (t >= ti) fl += s * Math.exp(-(t - ti) * 13); else if (t > ti - .05) fl += s * .4 * P(t, ti - .05, ti);
  if (fl > .005) { octx.globalCompositeOperation = 'lighter'; octx.fillStyle = `rgba(255,240,210,${clamp(fl)})`; octx.fillRect(0, 0, W, H); octx.globalCompositeOperation = 'source-over'; }

}

/* ---------- boot ---------- */
window.ready = (async () => {

  await Promise.all(fams.map(f => document.fonts.load(f, 'ÁÉÍÓÚÃÕÇÊ0123456789')));
  await document.fonts.ready; return true;
})();
window.render = render;
if (!/[?&]render/.test(location.search)) {
  // live preview: click to play with soundtrack
  const au = document.getElementById('a'); let start = null;
  window.ready.then(() => { render(18.6, 1); octx.fillStyle = 'rgba(10,10,15,.6)'; octx.fillRect(0, 0, W, H); txt(octx, '▶  CLIQUE PARA ASSISTIR', W / 2, H / 2, 'Inter', 28, 600, C.goldHi, 'center', 1, 6, false, 'middle'); });
  out.addEventListener('click', () => { au.currentTime = 0; au.play().catch(() => {}); start = performance.now(); });
  const loop = () => { if (start !== null) { let t = au && !au.paused && au.currentTime > 0 ? au.currentTime : (performance.now() - start) / 1000; if (t >= DUR) { t = DUR - .001; start = null; } render(t, 2); } requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
